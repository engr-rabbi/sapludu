<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<title>Sapludu — offline</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;
         background:linear-gradient(#ecfdf5,#fff); color:#064e3b; text-align:center; padding:24px; box-sizing:border-box; }
  main { max-width:420px; }
  img { width:96px; height:96px; border-radius:22px; box-shadow:0 8px 24px #05966933; }
  h1 { margin:18px 0 6px; font-size:1.6rem; }
  p { color:#475569; line-height:1.5; margin:8px 0; }
  button { margin-top:18px; border:0; background:#059669; color:#fff; font-weight:800; font-size:1rem; padding:14px 26px; border-radius:14px; }
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="">
  <h1>You're offline · আপনি অফলাইনে</h1>
  <p>Online multiplayer, sign-in, friends and the leaderboard need an internet connection. Nothing is simulated while you are offline.</p>
  <p>Reconnect and try again — your account and game history are safe.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
