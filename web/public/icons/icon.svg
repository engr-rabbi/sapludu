<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/><stop offset="0.55" stop-color="#84cc16"/><stop offset="1" stop-color="#3f6212"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b45309"/><stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <pattern id="scales" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="26" height="26" fill="none"/><circle cx="13" cy="13" r="9" fill="none" stroke="#14532d" stroke-opacity=".35" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- board squares hint -->
  <g opacity=".12" fill="#fff">
    <rect x="0" y="0" width="128" height="128"/><rect x="256" y="0" width="128" height="128"/>
    <rect x="128" y="128" width="128" height="128"/><rect x="384" y="128" width="128" height="128"/>
    <rect x="0" y="256" width="128" height="128"/><rect x="256" y="256" width="128" height="128"/>
    <rect x="128" y="384" width="128" height="128"/><rect x="384" y="384" width="128" height="128"/>
  </g>
  <!-- ladder -->
  <g transform="rotate(14 130 330)">
    <rect x="96" y="150" width="20" height="300" rx="8" fill="url(#wood)"/>
    <rect x="176" y="150" width="20" height="300" rx="8" fill="url(#wood)"/>
    <g fill="#a16207"><rect x="104" y="190" width="84" height="14" rx="6"/><rect x="104" y="250" width="84" height="14" rx="6"/><rect x="104" y="310" width="84" height="14" rx="6"/><rect x="104" y="370" width="84" height="14" rx="6"/></g>
  </g>
  <!-- snake body -->
  <path d="M400 430 C 250 460, 190 380, 300 330 C 410 280, 330 190, 230 195 C 170 198, 190 120, 270 108"
        fill="none" stroke="#14532d" stroke-width="74" stroke-linecap="round"/>
  <path d="M400 430 C 250 460, 190 380, 300 330 C 410 280, 330 190, 230 195 C 170 198, 190 120, 270 108"
        fill="none" stroke="url(#snake)" stroke-width="62" stroke-linecap="round"/>
  <path d="M400 430 C 250 460, 190 380, 300 330 C 410 280, 330 190, 230 195 C 170 198, 190 120, 270 108"
        fill="none" stroke="url(#scales)" stroke-width="62" stroke-linecap="round"/>
  <!-- head -->
  <g transform="translate(292 96) rotate(-12)">
    <ellipse cx="0" cy="0" rx="58" ry="46" fill="#3f6212"/>
    <ellipse cx="0" cy="-2" rx="52" ry="40" fill="url(#snake)"/>
    <ellipse cx="-16" cy="-12" rx="12" ry="15" fill="#fef9c3"/><ellipse cx="-16" cy="-12" rx="4.5" ry="12" fill="#111"/>
    <ellipse cx="22" cy="-14" rx="12" ry="15" fill="#fef9c3"/><ellipse cx="22" cy="-14" rx="4.5" ry="12" fill="#111"/>
    <path d="M52 8 C 90 8, 100 -6, 124 -10 M 98 -2 L 118 12 M 98 -2 L 120 -22" stroke="#dc2626" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>
</svg>
